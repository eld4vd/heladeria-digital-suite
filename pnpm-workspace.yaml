packages:
  - 'web'
  - 'admin'
  - 'api'
verifyDepsBeforeRun: error
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - data-urls@8.0.0
  - jsdom@30.1.2
  - lucide-react@1.52.0
  - tr46@7.0.0
  - whatwg-url@17.2.0
